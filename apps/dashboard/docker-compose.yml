# Docker Compose for the public pi-tps-web dashboard.
# Caddy serves the built static dashboard and sanitized metrics with HTTPS.
#
# Usage:
#   docker compose up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_ROOT:-.}:/srv/pi-dashboard:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-:80}
      - DASHBOARD_ROOT=${DASHBOARD_ROOT:-/srv/pi-dashboard/dist}
      - METRICS_ROOT=${METRICS_ROOT:-/srv/pi-dashboard/metrics}

volumes:
  caddy_data:
  caddy_config:
